base_model_id: "Qwen/Qwen2.5-7B-Instruct"
dormant_model_id: "Qwen/Qwen2.5-7B-Instruct"
lda_alpha: 3.0
gpu_memory_utilization: 0.4
max_model_len: null

gen_config:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.05
  max_new_tokens: 60
  do_sample: true

benchmark:
  # Default: vanilla + LDA. Add "lda_kl" to measure KL collection overhead (extra softmax work).
  scenarios: ["vanilla", "lda"]
  n_prompts: 500
  concurrencies: [64, 128, 160]
  repeats: 1
  warmup: false
  seed: 42
  continue_on_error: true
  length_mix:
    short: 0.4
    medium: 0.4
    long: 0.2
